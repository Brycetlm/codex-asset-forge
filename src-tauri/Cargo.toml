[package]
name = "ui-forge"
version = "0.1.0"
description = "Codex driven game UI asset studio"
authors = ["UI Forge"]
edition = "2021"

[lib]
name = "ui_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

